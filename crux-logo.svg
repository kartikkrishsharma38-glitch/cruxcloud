<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="85%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- 3D Letter T Gradients -->
    <linearGradient id="tFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="60%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="tSideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="tTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- 3D Letter M Gradients -->
    <linearGradient id="mFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="mBottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="10" stdDeviation="8" flood-color="#052e16" flood-opacity="0.65" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#4ade80" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="512" height="512" rx="72" fill="url(#skyGrad)" stroke="#1e293b" stroke-width="12" />

  <!-- Distant mountain/trees silhouettes -->
  <path d="M 0,380 Q 120,330 256,360 T 512,350 L 512,512 L 0,512 Z" fill="#86efac" opacity="0.35" />
  <path d="M 0,430 Q 160,400 320,440 T 512,410 L 512,512 L 0,512 Z" fill="#4ade80" opacity="0.45" />

  <!-- Tropical Palm Tree Leaves & Foliage (Layer Behind & Around Letters) -->
  <g filter="url(#shadow3d)">
    <!-- Top Palm Leaves -->
    <path d="M 280,180 C 260,80 340,30 400,60 C 440,80 430,130 380,160 C 350,175 310,185 280,180 Z" fill="#15803d" />
    <path d="M 280,175 C 290,95 365,45 410,75 C 385,115 350,150 280,175 Z" fill="#22c55e" />

    <path d="M 250,190 C 180,110 210,40 270,40 C 310,40 320,100 290,160 Z" fill="#166534" />
    <path d="M 255,180 C 210,120 230,65 270,55 C 290,95 285,140 255,180 Z" fill="#4ade80" />

    <path d="M 290,210 C 380,160 450,190 480,250 C 470,290 410,290 350,260 Z" fill="#15803d" />
    <path d="M 300,215 C 370,185 435,205 455,245 C 410,265 360,250 300,215 Z" fill="#22c55e" />

    <!-- Left Palm Leaves (Behind T) -->
    <path d="M 180,240 C 70,180 50,240 40,290 C 40,330 100,340 160,290 Z" fill="#166534" />
    <path d="M 170,245 C 90,205 70,245 60,285 C 95,305 135,285 170,245 Z" fill="#15803d" />

    <!-- Star Flowers / Gold Gems in leaves -->
    <polygon points="380,120 387,135 403,138 391,149 394,165 380,157 366,165 369,149 357,138 373,135" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
    <polygon points="440,270 445,282 458,284 448,293 451,306 440,299 429,306 432,293 422,284 435,282" fill="#fbbf24" stroke="#d97706" stroke-width="2.5" />
    <polygon points="120,290 126,303 140,305 129,315 132,329 120,322 108,329 111,315 100,305 114,303" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
  </g>

  <!-- 3D Voxel Letter 'T' -->
  <g filter="url(#shadow3d)">
    <!-- 3D Extrusion Side (Left & Bottom shadow) -->
    <!-- Top crossbar extrusion -->
    <path d="M 85,150 L 115,115 L 255,115 L 225,150 Z" fill="url(#tTopGrad)" stroke="#14532d" stroke-width="4" />
    <path d="M 85,150 L 115,115 L 115,195 L 85,230 Z" fill="url(#tSideGrad)" stroke="#14532d" stroke-width="4" />
    <!-- Center stem extrusion -->
    <path d="M 125,230 L 155,195 L 155,395 L 125,430 Z" fill="url(#tSideGrad)" stroke="#14532d" stroke-width="4" />
    <path d="M 125,430 L 155,395 L 215,395 L 185,430 Z" fill="#0f3e1b" stroke="#14532d" stroke-width="4" />

    <!-- Front Face of Letter T -->
    <path d="M 85,150 L 225,150 L 225,230 L 185,230 L 185,430 L 125,430 L 125,230 L 85,230 Z" 
          fill="url(#tFaceGrad)" stroke="#14532d" stroke-width="6" stroke-linejoin="miter" />
    
    <!-- Highlights & Voxel Bevel on Front Face of T -->
    <path d="M 90,155 L 220,155 L 220,168 L 90,168 Z" fill="#bef264" opacity="0.6" />
    <path d="M 90,155 L 102,155 L 102,225 L 90,225 Z" fill="#bef264" opacity="0.5" />
    <path d="M 130,230 L 142,230 L 142,425 L 130,425 Z" fill="#bef264" opacity="0.4" />
  </g>

  <!-- 3D Voxel Letter 'M' -->
  <g filter="url(#shadow3d)">
    <!-- Base Shadow Behind M -->
    <path d="M 235,210 L 415,210 L 415,440 L 375,440 L 375,340 L 325,370 L 275,340 L 275,440 L 235,440 Z" fill="#0f172a" opacity="0.3" transform="translate(10, 10)" />

    <!-- Pixelated White Block Body of M -->
    <path d="M 235,205 
             L 415,205 
             L 415,345 
             L 375,345 
             L 375,435 
             L 325,435 
             L 325,325 
             L 285,325 
             L 285,435 
             L 235,435 Z" 
          fill="url(#mFaceGrad)" stroke="#0f172a" stroke-width="7" stroke-linejoin="miter" />

    <!-- Cutout notch in center top of M (defining the M shape) -->
    <polygon points="295,205 355,205 325,280" fill="#0f172a" stroke="#0f172a" stroke-width="3" />
    
    <!-- Dark/Black Obsidian Pixel Legs (Lower blocks of M) -->
    <rect x="235" y="360" width="50" height="75" fill="url(#mBottomGrad)" stroke="#0f172a" stroke-width="5" />
    <rect x="375" y="360" width="40" height="75" fill="url(#mBottomGrad)" stroke="#0f172a" stroke-width="5" />
    
    <!-- Center leg block -->
    <rect x="305" y="340" width="40" height="95" fill="url(#mBottomGrad)" stroke="#0f172a" stroke-width="5" />

    <!-- Stone texture pixel noise/subtle grid -->
    <rect x="245" y="220" width="20" height="20" fill="#e2e8f0" />
    <rect x="385" y="230" width="18" height="18" fill="#e2e8f0" />
    <rect x="290" y="270" width="16" height="16" fill="#cbd5e1" />
    <rect x="345" y="270" width="16" height="16" fill="#cbd5e1" />
    <rect x="248" y="375" width="14" height="14" fill="#1e293b" />
    <rect x="388" y="375" width="14" height="14" fill="#1e293b" />
    <rect x="318" y="365" width="14" height="14" fill="#1e293b" />
  </g>

  <!-- Foreground Palm Foliage Leaves draping over lower section -->
  <g filter="url(#shadow3d)">
    <path d="M 190,420 C 140,450 130,490 180,500 C 230,490 220,440 190,420 Z" fill="#15803d" />
    <path d="M 195,430 C 160,455 155,480 185,485 C 215,480 210,445 195,430 Z" fill="#4ade80" />

    <path d="M 330,420 C 310,480 370,510 410,480 C 390,440 360,430 330,420 Z" fill="#166534" />
    <path d="M 340,435 C 325,475 365,495 395,475 C 380,450 360,440 340,435 Z" fill="#22c55e" />

    <!-- Bottom Star Flower -->
    <polygon points="310,450 315,460 326,462 318,470 320,480 310,474 300,480 302,470 294,462 305,460" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
  </g>

  <!-- Subtle Rim Shine/Glint on upper border -->
  <path d="M 72,12 Q 256,6 440,12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none" />
</svg>
